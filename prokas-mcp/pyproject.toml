[project]
name = "prokas-mcp"
version = "1.0.0"
description = "Lokaler, schreibgeschützter MCP-Connector für PROKAS7 Berichtswesen (Z-Listen-Exporte)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "PyYAML>=6.0",
    "tzdata>=2024.1",
]

[project.scripts]
prokas-mcp = "prokas_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prokas_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
